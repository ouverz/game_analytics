[project]
name = "game-analytics"
version = "0.1.0"
description = "Validated DuckDB and dbt foundation for launch telemetry"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.12,<1.13",
    "dbt-duckdb>=1.11,<1.12",
    "duckdb>=1.4,<1.5",
    "pandas>=3.0.5",
]

[project.scripts]
game-analytics = "game_analytics.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/game_analytics"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
